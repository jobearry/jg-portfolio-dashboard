<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" (click)="cancel()">
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="experience-form-title"
    class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-xl border border-border bg-card p-6 text-card-foreground shadow-xl"
    (click)="$event.stopPropagation()"
    (keydown.escape)="cancel()"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 id="experience-form-title" class="text-lg font-semibold">
          {{ experience() ? 'Edit experience' : 'Add experience' }}
        </h2>
        <p class="mt-1 text-sm text-muted-foreground">
          Company, role, and start date are required. Projects are managed separately.
        </p>
      </div>
      <button
        type="button"
        aria-label="Close dialog"
        class="rounded-sm p-1 text-muted-foreground transition-colors hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        (click)="cancel()"
      >
        <ng-icon name="lucideX" size="18" aria-hidden="true" />
      </button>
    </div>

    <form class="mt-5 grid gap-4 sm:grid-cols-2" (submit)="submit($event)">
      <div>
        <label for="experience-company" class="block text-sm font-medium">Company</label>
        <input
          #companyInput
          id="experience-company"
          type="text"
          required
          [value]="company()"
          (input)="onInput('company', $event)"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        />
      </div>

      <div>
        <label for="experience-role" class="block text-sm font-medium">Role</label>
        <input
          id="experience-role"
          type="text"
          required
          [value]="role()"
          (input)="onInput('role', $event)"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        />
      </div>

      <div>
        <label for="experience-started-at" class="block text-sm font-medium">Start date</label>
        <input
          id="experience-started-at"
          type="date"
          required
          [value]="startedAt()"
          (input)="onInput('startedAt', $event)"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        />
      </div>

      <div>
        <label for="experience-finished-at" class="block text-sm font-medium">
          End date <span class="font-normal text-muted-foreground">(optional)</span>
        </label>
        <input
          id="experience-finished-at"
          type="date"
          [value]="finishedAt()"
          (input)="onInput('finishedAt', $event)"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        />
      </div>

      <div class="sm:col-span-2">
        <label for="experience-type" class="block text-sm font-medium">Type</label>
        <input
          id="experience-type"
          type="text"
          [value]="type()"
          (input)="onInput('type', $event)"
          placeholder="Full-time"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        />
      </div>

      <div class="sm:col-span-2">
        <label for="experience-description" class="block text-sm font-medium">Description</label>
        <textarea
          id="experience-description"
          rows="2"
          [value]="description()"
          (input)="onInput('description', $event)"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        ></textarea>
      </div>

      <div class="sm:col-span-2">
        <label for="experience-responsibility" class="block text-sm font-medium">
          Responsibility
        </label>
        <textarea
          id="experience-responsibility"
          rows="3"
          [value]="responsibility()"
          (input)="onInput('responsibility', $event)"
          class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
        ></textarea>
      </div>

      @if (error()) {
        <p role="alert" class="text-sm text-destructive sm:col-span-2">{{ error() }}</p>
      }

      <div class="flex justify-end gap-2 sm:col-span-2">
        <button
          type="button"
          class="rounded-md border border-border px-3 py-2 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
          (click)="cancel()"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!canSave()"
          class="rounded-md bg-accent-brand px-3 py-2 text-sm font-semibold text-white transition-colors hover:opacity-90 focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50"
        >
          Save
        </button>
      </div>
    </form>
  </div>
</div>

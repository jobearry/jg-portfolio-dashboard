<form class="flex flex-col gap-4" (submit)="submit($event)">
  <div>
    <label for="project-name" class="block text-sm font-medium">Project name</label>
    <input
      id="project-name"
      type="text"
      required
      [value]="projectName()"
      (input)="onInput('projectName', $event)"
      class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
    />
  </div>

  <div>
    <label for="project-description" class="block text-sm font-medium">Description</label>
    <textarea
      id="project-description"
      rows="2"
      [value]="description()"
      (input)="onInput('description', $event)"
      class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
    ></textarea>
  </div>

  <div>
    <label for="project-contribution" class="block text-sm font-medium">Contribution</label>
    <textarea
      id="project-contribution"
      rows="2"
      [value]="contribution()"
      (input)="onInput('contribution', $event)"
      class="mt-1 w-full rounded-md border border-border bg-background px-3 py-2 text-sm focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
    ></textarea>
  </div>

  @if (error()) {
    <p role="alert" class="text-sm text-destructive">{{ error() }}</p>
  }

  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="rounded-md border border-border px-3 py-2 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      type="submit"
      [disabled]="!canSave()"
      class="rounded-md bg-accent-brand px-3 py-2 text-sm font-semibold text-white transition-colors hover:opacity-90 focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50"
    >
      Save project
    </button>
  </div>
</form>

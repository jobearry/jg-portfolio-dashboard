<button
  #trigger
  type="button"
  aria-label="View dashboard"
  aria-haspopup="dialog"
  [attr.aria-expanded]="dialogOpen()"
  class="inline-flex size-9 items-center justify-center rounded-full border border-border text-muted-foreground transition-colors hover:border-accent-brand hover:text-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background focus-visible:outline-none"
  (click)="open()"
>
  <ng-icon name="lucideLayoutDashboard" size="18" aria-hidden="true" />
</button>

@if (dialogOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4"
    (click)="cancel()"
  >
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="dashboard-token-title"
      class="w-full max-w-md rounded-xl border border-border bg-card p-6 text-card-foreground shadow-xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="dashboard-token-title" class="text-lg font-semibold">Unlock dashboard</h2>
          <p class="mt-1 text-sm text-muted-foreground">
            Paste the JWT you received from the API login endpoint.
          </p>
        </div>
        <button
          type="button"
          aria-label="Close dialog"
          class="rounded-sm p-1 text-muted-foreground transition-colors hover:text-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
          (click)="cancel()"
        >
          <ng-icon name="lucideX" size="18" aria-hidden="true" />
        </button>
      </div>

      <form class="mt-5 space-y-4" (submit)="submit($event)">
        <div>
          <label for="dashboard-token" class="block text-sm font-medium">Token</label>
          <input
            #tokenInput
            id="dashboard-token"
            type="password"
            autocomplete="off"
            spellcheck="false"
            [value]="token()"
            (input)="onInput($event)"
            class="mt-2 w-full rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground placeholder:text-muted-foreground focus-visible:border-accent-brand focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
            placeholder="eyJhbGciOi..."
          />
        </div>

        @if (authError()) {
          <p role="alert" class="text-sm text-destructive">{{ authError() }}</p>
        }

        <div class="flex justify-end gap-2">
          <button
            type="button"
            class="rounded-md border border-border px-3 py-2 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
            (click)="cancel()"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="busy() || !token().trim()"
            class="rounded-md bg-accent-brand px-3 py-2 text-sm font-semibold text-white transition-colors hover:opacity-90 focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50"
          >
            {{ busy() ? 'Checking…' : 'Unlock' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}

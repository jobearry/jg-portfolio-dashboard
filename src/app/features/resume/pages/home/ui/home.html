<section id="top" class="mx-auto grid w-full max-w-7xl gap-3 p-3 sm:gap-4 sm:p-4 lg:gap-6 lg:p-8">
  <app-profile></app-profile>

  <div class="grid grid-cols-6 gap-x-2 md:gap-x-6">
    <!--side block-->
    <div class="w-full col-span-full md:col-span-2">
      @for (block of sideblock; track $index) {
        <app-block [id]="block.id" [title]="block.title!" [class]="block.class! + ' rounded-sm'">
          @if (block.icon) {
            <ng-icon slot="icon" [name]="block.icon" />
          }

          <ng-container slot="content">
            <app-host [component]="block.content!" [inputs]="block.inputs"> </app-host>
          </ng-container>
        </app-block>
      }
    </div>

    <!--main block-->
    <div
      class="w-full col-span-full md:col-span-4 md:[--card:var(--color-background)] md:[--card-foreground:var(--type-color)]"
    >
      @for (block of mainblock; track $index) {
        <app-block
          [id]="block.id"
          [title]="block.title!"
          [class]="`${block.class} rounded-sm md:rounded-none md:border-0 md:border-b`"
        >
          @if (block.icon) {
            <ng-icon slot="icon" [name]="block.icon" />
          }

          <ng-container slot="content">
            <app-host [component]="block.content!" [inputs]="block.inputs"> </app-host>
          </ng-container>
        </app-block>
      }
    </div>
  </div>

  <app-resume-footer />
</section>

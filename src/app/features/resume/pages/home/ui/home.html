<app-resume-header />

<main
  id="top"
  class="mx-auto flex w-full max-w-6xl flex-col gap-4 px-4 pt-6 pb-16 sm:px-6 sm:pt-10"
>
  <app-hero />

  <app-about />

  <app-resume-section sectionId="experience" title="Experience">
    <ng-icon section-icon name="lucideBriefcase" size="20" aria-hidden="true" />
    <app-timeline />
  </app-resume-section>

  <app-resume-section sectionId="certifications" title="Certifications">
    <ng-icon section-icon name="lucideAward" size="20" aria-hidden="true" />
    <app-certifications />
  </app-resume-section>

  <app-resume-section sectionId="tech-stack" title="Tech stack">
    <ng-icon section-icon name="lucideCode" size="20" aria-hidden="true" />
    <app-tech-stack-list />
  </app-resume-section>

  <app-resume-section sectionId="work" title="Recent projects">
    <ng-icon section-icon name="lucideGrid" size="20" aria-hidden="true" />
    <app-recent-repositories />
  </app-resume-section>

  <app-contact />
</main>

<app-resume-footer />
